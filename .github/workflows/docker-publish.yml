name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: talhary1/jupyter-bridge
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image (Fast AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Deployment Webhook
        if: success()
        run: |
          echo "Triggering deployment webhook..."
          curl -f -sS -X POST "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -d "{\"event\": \"image_pushed\", \"image\": \"talhary1/jupyter-bridge\", \"tag\": \"latest\", \"sha\": \"${{ github.sha }}\"}"
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
